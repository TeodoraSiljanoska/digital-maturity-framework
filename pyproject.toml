[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-maturity-framework"
version = "1.0.0"
description = "Intelligent AI framework for visual analytics, monitoring and prediction of digital transformation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0.0,<2.3.0",
  "numpy>=1.24.0,<2.0.0",
  "pyarrow>=14.0.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.0.0",
  "catboost>=1.2.0",
  "shap>=0.44.0",
  "lime>=0.2.0",
  "statsmodels>=0.14.0",
  "linearmodels>=5.4",
  "matplotlib>=3.7.0",
  "plotly>=5.18.0",
  "streamlit>=1.28.0",
  "pydantic>=2.0.0",
  "scipy>=1.11.0",
  "openpyxl>=3.1.0",
  "joblib>=1.3.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]